[package]
name        = "mnse-k"
description = "K Language compiler, interpreter, behavior engine, and CLI shell for MNSE Kernel"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[[bin]]
name = "k"
path = "src/main.rs"

[dependencies]
mnse-types  = { path = "../mnse-types" }
mnse-ledger = { path = "../mnse-ledger" }
mnse-graph  = { path = "../mnse-graph" }
mnse-sdk    = { path = "../mnse-sdk" }

tokio      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
toml       = { workspace = true }
rustyline  = { workspace = true }
clap       = { workspace = true }
anyhow     = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
chrono     = { workspace = true }
sha2       = { workspace = true }
hex        = { workspace = true }
uuid       = { workspace = true }
dirs       = "5.0"

[dev-dependencies]
tempfile   = { workspace = true }
